<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MEDNEX</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f8fb;
      color: #17202a;
    }

    header {
      background: #0b7285;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 36px;
    }

    header p {
      margin: 8px 0 0;
      font-size: 17px;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .welcome {
      text-align: center;
      margin-bottom: 30px;
    }

    .welcome h2 {
      font-size: 28px;
    }

    .search-box {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .search-box h2 {
      margin-top: 0;
    }

    .search-row {
      display: flex;
      gap: 10px;
    }

    #medicineSearch {
      flex: 1;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    #searchButton {
      padding: 15px 25px;
      border: none;
      border-radius: 10px;
      background: #0b7285;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #searchButton:hover {
      background: #095c6b;
    }

    #results {
      margin-top: 20px;
    }

    .medicine-card {
      background: #ffffff;
      border-right: 5px solid #0b7285;
      padding: 20px;
      margin-top: 15px;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.07);
    }

    .medicine-card h3 {
      margin-top: 0;
      color: #0b7285;
    }

    footer {
      text-align: center;
      margin-top: 50px;
      padding: 20px;
      color: #777;
    }

    @media (max-width: 600px) {
      .search-row {
        flex-direction: column;
      }

      #searchButton {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>MEDNEX</h1>
    <p>منصة ذكية للرعاية الصحية</p>
  </header>

  <div class="container">

    <div class="welcome">
      <h2>أهلًا بك في MEDNEX 💊</h2>
      <p>ابحث عن الدواء واحصل على معلوماته بسرعة.</p>
    </div>

    <div class="search-box">
      <h2>💊 البحث عن دواء</h2>

      <div class="search-row">
        <input
          type="text"
          id="medicineSearch"
          placeholder="اكتب اسم الدواء مثل Panadol"
        >

        <button id="searchButton">
          بحث
        </button>
      </div>

      <div id="results"></div>
    </div>

  </div>

  <footer>
    MEDNEX © 2026
  </footer>

  <script src="app.js"></script>

</body>
</html>
